# ─────────────────────────────────────────────────────────────────
# StockRAG — CI Pipeline
# Runs the full pytest suite with coverage on every push & PR.
# ─────────────────────────────────────────────────────────────────
name: StockRAG CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'stock_rag/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'stock_rag/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements.txt'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───── Stage 1: Lint ─────
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install linters
        run: pip install flake8 pycodestyle

      - name: Run flake8 (stock_rag only)
        run: |
          flake8 stock_rag/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402,E711,E712 \
            --count --statistics

  # ───── Stage 2: Unit & Integration Tests ─────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        os: [ubuntu-latest]
        include:
          - python-version: '3.12'
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stock_rag/requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          python -m pytest tests/ \
            -m "not slow" \
            --cov=stock_rag \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml \
            -v --tb=short

      - name: Enforce coverage threshold (≥ 70%)
        run: |
          python -m pytest tests/ \
            --cov=stock_rag \
            --cov-report=term \
            --cov-fail-under=70 \
            -q --no-header

      - name: Upload coverage report
        if: always() && matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Upload test results
        if: always() && matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ───── Stage 3: Coverage Badge (optional, main branch only) ─────
  coverage-badge:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r stock_rag/requirements.txt
          pip install pytest pytest-cov

      - name: Generate coverage summary
        run: |
          python -m pytest tests/ \
            --cov=stock_rag \
            --cov-report=term \
            -q --no-header 2>&1 | tail -20
          echo "✅ Coverage report generated"
