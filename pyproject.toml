[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
addopts = "-v --tb=short -q"

[tool.coverage.run]
source = ["stock_rag"]
omit = ["stock_rag/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
